name: ionhive_water_purifier

description: "A Flutter-based application for the AquaPulse water purifier system, comprising an Admin System for managing devices, users, roles, and services; an End User App for subscription management, device monitoring, analytics, and shopping; and a Service/Installation App for handling installation and service requests with photo uploads and status updates."
publish_to: 'none'

version: 1.0.2+2

environment:
  sdk: ">=3.6.0 <4.0.0"


dependencies:
  flutter:
    sdk: flutter
  # UI enhancements
  cupertino_icons: ^1.0.8
  # State management
  get: ^4.6.6
  # Networking for API calls
  http: ^1.2.0
  connectivity_plus: ^5.0.2
  # Authentication with Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  firebase_messaging: ^14.5.0
  # Local storage for caching
  shared_preferences: ^2.2.2
  # Charts for analytics visualization
  fl_chart: ^0.68.0
  # Notifications
  flutter_local_notifications: ^17.0.0
  # Image picker for photo uploads in Service/Installation App
  image_picker: ^1.0.7
  # JSON serialization
  json_annotation: ^4.8.1
  # Environment variables
  flutter_dotenv: ^5.1.0
  # For Style Guide
  flutter_spinkit: ^5.2.1
  google_fonts: ^6.2.1
  pinput: ^5.0.0
  intl_phone_field: ^3.2.0
  animate_do: ^3.3.4
  flutter_blurhash: ^0.9.1
  simple_animations: ^5.0.0+3
  smooth_page_indicator: ^1.1.0
  # For External
  url_launcher: ^6.3.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  file_picker: ^8.1.2
  # WebView for external links
  webview_flutter: ^4.8.0
  webview_flutter_android: ^3.15.0
  webview_flutter_wkwebview: ^3.12.0
  package_info_plus: ^8.3.0
  permission_handler: ^12.0.0+1
  device_info_plus: ^9.1.2
  cached_network_image: ^3.4.1
  material_design_icons_flutter: ^7.0.7296
  path_provider: ^2.1.3
  open_file: ^3.5.8
  # Bluetooth functionality
  flutter_blue_plus: ^1.32.8
  flutter_bluetooth_serial:
    path: plugins/flutter_bluetooth_serial
  barcode_scan2: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.8
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins/Poppins-Bold.ttf
          weight: 600
  assets:
    - assets/AquaPluse_logo/
    - assets/Image/
    - assets/icons/
    - .env
    - stateDistricts.json

flutter_native_splash:
  color: "#000000"
  image: assets/AquaPluse_logo/AquaPluse.png
  ios: true
  web: true
  fullscreen: true